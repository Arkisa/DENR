{% extends "accounts/base.html" %}

{% block title %}Check your email{% endblock %}
{% block content %}
<section class="card card-center">
  <div class="badge">
    <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
  </div>
  <h2>Registration complete</h2>
  <p class="muted">We sent a verification link to <strong>{{ email }}</strong>. Open it to finish signing up.</p>
  <a class="btn btn-link" href="{% url 'login' %}">Go to log in</a>
</section>
{% endblock %}
